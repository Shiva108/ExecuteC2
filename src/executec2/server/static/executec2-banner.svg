<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">ExecuteC2 banner</title>
  <desc id="desc">Dark neon ExecuteC2 banner with a hexagonal command icon and bold operator control headline.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121821"/>
      <stop offset="100%" stop-color="#0c1119"/>
    </linearGradient>
    <linearGradient id="hexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39d5cd"/>
      <stop offset="100%" stop-color="#1f7f8f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6671"/>
      <stop offset="100%" stop-color="#ff304b"/>
    </linearGradient>
    <filter id="cyanBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="redBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="36" fill="url(#bg)"/>
  <rect x="2" y="2" width="1596" height="416" rx="34" fill="none" stroke="#2a313e" stroke-width="2"/>

  <g transform="translate(66 44)">
    <path d="M136 10 265 84 265 232 136 306 7 232 7 84Z" fill="#1a212c" stroke="#2d3b48" stroke-width="4"/>
    <path d="M136 16 259 87 259 229 136 300 13 229 13 87Z" fill="none" stroke="#39d5cd" stroke-opacity="0.26" stroke-width="3"/>

    <g filter="url(#redBlur)" opacity="0.95">
      <path d="M24 58 126 160" stroke="#ff4a5e" stroke-width="11" stroke-linecap="round"/>
    </g>
    <path d="M24 58 126 160" stroke="url(#beam)" stroke-width="9" stroke-linecap="round"/>
    <path d="M110 144 126 160 112 177" fill="none" stroke="#ff6878" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(135 160)">
      <g filter="url(#cyanBlur)" opacity="0.95">
        <circle cx="0" cy="0" r="27" fill="#30d6ca"/>
        <circle cx="-58" cy="0" r="10" fill="#30d6ca"/>
        <circle cx="61" cy="11" r="10" fill="#30d6ca"/>
        <circle cx="-33" cy="50" r="10" fill="#30d6ca"/>
        <circle cx="31" cy="53" r="10" fill="#30d6ca"/>
        <circle cx="50" cy="-37" r="10" fill="#30d6ca"/>
      </g>
      <g stroke="#2b9ba3" stroke-width="3.5" stroke-linecap="round">
        <path d="M0 0 -58 0"/>
        <path d="M0 0 61 11"/>
        <path d="M0 0 -33 50"/>
        <path d="M0 0 31 53"/>
        <path d="M0 0 50 -37"/>
      </g>
      <g fill="#38ddd1">
        <circle cx="0" cy="0" r="24"/>
        <circle cx="-58" cy="0" r="9"/>
        <circle cx="61" cy="11" r="9"/>
        <circle cx="-33" cy="50" r="9"/>
        <circle cx="31" cy="53" r="9"/>
        <circle cx="50" cy="-37" r="9"/>
      </g>
      <g stroke="#ff5c6e" stroke-width="4" stroke-linecap="round">
        <path d="M-8 -10 9 8"/>
        <path d="M10 -9 -10 9"/>
      </g>
    </g>
  </g>

  <g transform="translate(414 78)">
    <text x="0" y="40" fill="#35d2c7" font-size="21" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" letter-spacing="8">CURATED OPERATOR CONTROL SURFACE</text>
    <text x="0" y="132" fill="#dfe6ee" font-size="90" font-weight="700" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" letter-spacing="-2">ExecuteC2</text>
    <text x="0" y="190" fill="#97a2b2" font-size="31" font-weight="500" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Encrypted listeners, operator sync, and task dispatch</text>
    <text x="0" y="226" fill="#97a2b2" font-size="31" font-weight="500" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">for authorized red team operations</text>

    <g transform="translate(0 252)" filter="url(#cardShadow)">
      <rect width="312" height="54" rx="16" fill="#0d131b" stroke="#313948" stroke-width="2"/>
      <text x="24" y="35" fill="#35d2c7" font-size="28" font-weight="700" font-family="'IBM Plex Mono', 'SFMono-Regular', monospace" letter-spacing="1">AES-GCM / WSS / REST</text>
    </g>

    <text x="338" y="289" fill="#717887" font-size="26" font-weight="500" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">FASTAPI • ASYNCIO • SQLITE • PLUGINS</text>
  </g>
</svg>
