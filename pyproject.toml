[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "executec2"
version = "0.1.0"
description = "ExecuteC2 — Python C2 Teamserver"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiosqlite>=0.20",
    "pyjwt>=2.9",
    "cryptography>=44.0",
    "msgpack>=1.1",
    "pydantic>=2.10",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "jinja2>=3.1",
]

[project.scripts]
executec2 = "executec2.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/executec2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/executec2"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
